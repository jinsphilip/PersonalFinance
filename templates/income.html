{% extends "base.html" %}
{% block title %}Income · FinTracker{% endblock %}
{% block page_title %}Income{% endblock %}

{% block content %}
<div class="cards-row">
  <div class="card"><div class="card-label">Total Income</div><div class="card-value green" id="total">—</div></div>
  <div class="card"><div class="card-label">Salary</div><div class="card-value" id="salary">—</div></div>
  <div class="card"><div class="card-label">Dividends</div><div class="card-value" id="dividend">—</div></div>
  <div class="card"><div class="card-label">Entries</div><div class="card-value" id="count">—</div></div>
</div>

<div class="section">
  <div class="section-header">
    <span class="section-title">Income Entries</span>
    <button class="btn btn-primary" onclick="openAdd()">+ Add Income</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Type</th><th>Date</th><th>Source</th><th>Description</th>
        <th style="text-align:right">Amount</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="formModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3>Add Income</h3>
      <button class="modal-close" onclick="closeModal('formModal')">&times;</button>
    </div>
    <form id="incomeForm" onsubmit="return saveForm(event)">
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group"><label>Type</label>
            <select name="income_type" id="incomeType" onchange="toggleType()">
              <option value="salary">Salary</option><option value="dividend">Dividend</option>
            </select>
          </div>
          <div class="form-group"><label>Amount (₹)</label><input name="amount" type="number" step="any" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date</label><input name="date" type="date"></div>
          <div class="form-group" id="employerGroup"><label>Employer</label><input name="employer"></div>
          <div class="form-group" id="stockGroup" style="display:none"><label>Stock</label><input name="stock_name"></div>
        </div>
        <div class="form-row single">
          <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const API = '/api/income';
let rows = [];

function toggleType() {
  const isSalary = document.getElementById('incomeType').value === 'salary';
  document.getElementById('employerGroup').style.display = isSalary ? '' : 'none';
  document.getElementById('stockGroup').style.display = isSalary ? 'none' : '';
}

async function load() {
  rows = await apiGet(API);
  const sal = rows.filter(r => r.income_type === 'salary').reduce((s, r) => s + r.amount, 0);
  const div = rows.filter(r => r.income_type === 'dividend').reduce((s, r) => s + r.amount, 0);
  document.getElementById('total').textContent = fmt(sal + div);
  document.getElementById('salary').textContent = fmt(sal);
  document.getElementById('dividend').textContent = fmt(div);
  document.getElementById('count').textContent = rows.length;

  const tb = document.getElementById('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">No income recorded yet.</td></tr>'; return; }
  tb.innerHTML = rows.map(r => {
    const badge = r.income_type === 'salary' ? 'badge-blue' : 'badge-green';
    const source = r.income_type === 'salary' ? esc(r.employer) : esc(r.stock_name);
    return `<tr>
      <td><span class="badge ${badge}">${esc(r.income_type)}</span></td>
      <td>${fmtDate(r.date)}</td>
      <td>${source || '—'}</td>
      <td style="color:#6b7280;font-size:13px">${esc(r.description) || '—'}</td>
      <td style="text-align:right" class="gain">${fmt(r.amount)}</td>
      <td><div class="actions">
        <button class="btn-icon del" onclick='del(${r.id})'>🗑</button>
      </div></td>
    </tr>`;
  }).join('');
}

function openAdd() {
  document.getElementById('incomeForm').reset();
  toggleType();
  openModal('formModal');
}
async function saveForm(e) {
  e.preventDefault();
  const data = formToObject('incomeForm');
  try {
    await apiSend(API, 'POST', data);
    closeModal('formModal'); showToast('Saved'); load();
  } catch { showToast('Save failed', 'error'); }
  return false;
}
function del(id) {
  confirmDelete(async () => {
    try { await apiSend(`${API}/${id}`, 'DELETE'); showToast('Deleted'); load(); }
    catch { showToast('Delete failed', 'error'); }
  });
}

load().catch(() => showToast('Failed to load', 'error'));
</script>
{% endblock %}
