<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · FinTracker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #1a1a2e; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
      padding: 32px 28px; width: 100%; max-width: 360px; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand .logo { font-size: 34px; }
    .brand h1 { font-size: 20px; margin: 8px 0 2px; }
    .brand p { margin: 0; color: #6b7280; font-size: 13px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type=password] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #d1d5db;
      border-radius: 8px; outline: none; }
    input[type=password]:focus { border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76,175,80,.15); }
    button { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
      background: #4CAF50; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #43a047; }
    .error { background: #fdecea; color: #b71c1c; border-radius: 8px; padding: 10px 12px; font-size: 13px;
      margin-bottom: 14px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand">
      <div class="logo">💰</div>
      <h1>FinTracker</h1>
      <p>Enter your password to continue</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
