{% extends "base.html" %}
{% block title %}Expenses · FinTracker{% endblock %}
{% block page_title %}Expenses{% endblock %}

{% block content %}
<div class="cards-row">
  <div class="card"><div class="card-label">This Month</div><div class="card-value red" id="thisMonth">—</div></div>
  <div class="card"><div class="card-label">All Time Total</div><div class="card-value" id="allTime">—</div></div>
  <div class="card"><div class="card-label">Records</div><div class="card-value" id="count">—</div></div>
</div>

<div class="section">
  <div class="section-header">
    <span class="section-title">Expense Log</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <select id="filterMonth" class="form-group select-inline" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;"></select>
      <select id="filterCat" class="form-group select-inline" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;">
        <option value="">All Categories</option>
        <option>Food</option><option>Transport</option><option>Shopping</option>
        <option>Health</option><option>Entertainment</option><option>Utilities</option>
        <option>Rent</option><option>Education</option><option>Fuel</option>
        <option>Chit Contribution</option><option>EMI</option><option>Other</option>
      </select>
      <button class="btn btn-primary" onclick="openAdd()">+ Add Expense</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Date</th><th>Category</th><th>Description</th><th>Account</th>
        <th style="text-align:right">Amount</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Expense</h3>
      <button class="modal-close" onclick="closeModal('formModal')">&times;</button>
    </div>
    <form id="expForm" onsubmit="return saveForm(event)">
      <div class="modal-body">
        <input type="hidden" name="id" id="expId">
        <div class="form-row">
          <div class="form-group"><label>Date</label><input name="date" type="date" required></div>
          <div class="form-group"><label>Amount (₹)</label><input name="amount" type="number" step="any" min="0" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Category</label>
            <select name="category" required>
              <option value="">Select…</option>
              <option>Food</option><option>Transport</option><option>Shopping</option>
              <option>Health</option><option>Entertainment</option><option>Utilities</option>
              <option>Rent</option><option>Education</option><option>Fuel</option>
              <option>Chit Contribution</option><option>EMI</option><option>Other</option>
            </select>
          </div>
          <div class="form-group"><label>Account</label>
            <select name="account_id" id="accountSel" required></select>
          </div>
        </div>
        <div class="form-row single">
          <div class="form-group"><label>Description</label><input name="description" placeholder="What did you spend on?"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const API = '/api/expenses';
const CATS = {
  'Food':'cat-food','Transport':'cat-transport','Shopping':'cat-shopping',
  'Health':'cat-health','Entertainment':'cat-entertainment','Utilities':'cat-utilities',
  'Rent':'cat-rent','Education':'cat-education','Fuel':'cat-fuel',
  'Chit Contribution':'cat-chit','EMI':'cat-emi','Other':'cat-other',
};
let allRows = [], accounts = [];

async function load() {
  [allRows, accounts] = await Promise.all([apiGet(API), apiGet('/api/bank-accounts')]);

  // Populate month filter
  const months = [...new Set(allRows.map(r => r.date.slice(0,7)))].sort().reverse();
  const mSel = document.getElementById('filterMonth');
  mSel.innerHTML = '<option value="">All Months</option>' +
    months.map(m => `<option value="${m}">${m}</option>`).join('');

  // Set default to current month if available
  const cur = new Date().toISOString().slice(0,7);
  if (months.includes(cur)) mSel.value = cur;

  render();
}

function render() {
  const mFilter = document.getElementById('filterMonth').value;
  const cFilter = document.getElementById('filterCat').value;
  const rows = allRows.filter(r =>
    (!mFilter || r.date.startsWith(mFilter)) &&
    (!cFilter || r.category === cFilter)
  );

  const total = allRows.reduce((s,r) => s+r.amount, 0);
  const curM = new Date().toISOString().slice(0,7);
  const monthly = allRows.filter(r => r.date.startsWith(curM)).reduce((s,r) => s+r.amount,0);
  document.getElementById('thisMonth').textContent = fmt(monthly);
  document.getElementById('allTime').textContent = fmt(total);
  document.getElementById('count').textContent = allRows.length;

  const tb = document.getElementById('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">No expenses found.</td></tr>'; return; }
  tb.innerHTML = rows.map(r => `
    <tr>
      <td>${fmtDate(r.date)}</td>
      <td><span class="badge ${CATS[r.category]||'cat-other'}">${esc(r.category)}</span></td>
      <td>${esc(r.description)||'—'}</td>
      <td>${esc(r.account_name)}</td>
      <td style="text-align:right" class="loss">−${fmt(r.amount)}</td>
      <td><div class="actions">
        <button class="btn-icon" onclick='openEdit(${r.id})'>✎</button>
        <button class="btn-icon del" onclick='del(${r.id})'>🗑</button>
      </div></td>
    </tr>`).join('');
}

document.getElementById('filterMonth').addEventListener('change', render);
document.getElementById('filterCat').addEventListener('change', render);

function populateAccounts(selId, selectedId) {
  const sel = document.getElementById(selId);
  sel.innerHTML = accounts.map(a =>
    `<option value="${a.id}" ${a.id==selectedId?'selected':''}>${esc(a.bank_name)}</option>`
  ).join('');
}

function openAdd() {
  document.getElementById('expForm').reset();
  document.getElementById('expId').value = '';
  document.getElementById('modalTitle').textContent = 'Add Expense';
  // default date to today
  document.querySelector('#expForm [name="date"]').value = new Date().toISOString().slice(0,10);
  populateAccounts('accountSel', null);
  openModal('formModal');
}
function openEdit(id) {
  const r = allRows.find(x => x.id === id);
  document.getElementById('expForm').reset();
  document.getElementById('expId').value = r.id;
  document.getElementById('modalTitle').textContent = 'Edit Expense';
  populateAccounts('accountSel', r.account_id);
  fillForm('expForm', r);
  openModal('formModal');
}
async function saveForm(e) {
  e.preventDefault();
  const data = formToObject('expForm');
  const id = data.id;
  try {
    if (id) await apiSend(`${API}/${id}`, 'PUT', data);
    else await apiSend(API, 'POST', data);
    closeModal('formModal'); showToast('Saved'); await load();
  } catch { showToast('Save failed', 'error'); }
  return false;
}
function del(id) {
  confirmDelete(async () => {
    try { await apiSend(`${API}/${id}`, 'DELETE'); showToast('Deleted'); await load(); }
    catch { showToast('Delete failed', 'error'); }
  });
}

load().catch(() => showToast('Failed to load', 'error'));
</script>
{% endblock %}
